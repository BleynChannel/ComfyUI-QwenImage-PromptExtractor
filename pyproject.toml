[project]
name = "QwenImage-PromptExtractor"
version = "0.1.0"
description = "ComfyUI custom node that resolves a Qwen Image 2.1 Prompt Enhancer JSON hint (rewritten prompt + aspect ratio/size) into a ready-to-use prompt and exact width/height."
license = "MIT"
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/BleynChannel/ComfyUI-QwenImage-PromptExtractor"
Documentation = "https://github.com/BleynChannel/ComfyUI-QwenImage-PromptExtractor#readme"
Repository = "https://github.com/BleynChannel/ComfyUI-QwenImage-PromptExtractor"
Source = "https://github.com/BleynChannel/ComfyUI-QwenImage-PromptExtractor"

[tool.comfy]
# Comfy Registry publisher id (the part after @ on your
# registry.comfy.org profile page). Globally unique and cannot be changed later.
PublisherId = "bleyn"
DisplayName = "Prompt & Dimensions from LLM"
requires-comfyui = ">=0.3.40"
